<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="funboxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#45B7D1;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#96CEB4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFEAA7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A29BFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FD79A8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- FunBox container -->
  <rect x="5" y="15" width="45" height="30" rx="8" fill="url(#funboxGradient)" filter="url(#glow)"/>
  
  <!-- FunBox text -->
  <text x="25" y="32" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Fun</text>
  <text x="25" y="42" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Box</text>
  
  <!-- AI container -->
  <rect x="150" y="15" width="45" height="30" rx="8" fill="url(#aiGradient)" filter="url(#glow)"/>
  
  <!-- AI text -->
  <text x="172" y="32" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">AI</text>
  
  <!-- Connection line -->
  <line x1="50" y1="30" x2="150" y2="30" stroke="url(#funboxGradient)" stroke-width="2" opacity="0.7"/>
  
  <!-- FunBoxAi main text -->
  <text x="100" y="25" text-anchor="middle" fill="url(#funboxGradient)" font-family="Arial, sans-serif" font-size="16" font-weight="bold">FunBox</text>
  <text x="100" y="45" text-anchor="middle" fill="url(#aiGradient)" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Ai</text>
</svg>